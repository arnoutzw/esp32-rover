<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <title>ESP32 Rover - Frame CAD Outline (mm)</title>

  <defs>
    <!-- Arrowhead marker for dimensions -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowhead-rev" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="#fff"/>

  <!-- Title block -->
  <rect x="10" y="10" width="580" height="60" fill="none" stroke="#333" stroke-width="1"/>
  <text x="300" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">ESP32 Rover - Frame &amp; Steering CAD Outline</text>
  <text x="300" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">All dimensions in mm | Scale 1:1 at 150mm wheelbase</text>

  <!-- Grid reference -->
  <text x="20" y="90" font-family="Arial, sans-serif" font-size="10" fill="#999">Grid: 10mm</text>

  <!-- ========== MAIN FRAME OUTLINE ========== -->
  <g id="main-frame" transform="translate(150, 120)">

    <!-- Main chassis plate outline -->
    <rect x="0" y="0" width="120" height="200" rx="5" ry="5"
          fill="none" stroke="#000" stroke-width="2"/>

    <!-- Chassis width dimension -->
    <line x1="0" y1="-25" x2="120" y2="-25" stroke="#666" stroke-width="0.5"
          marker-start="url(#arrowhead-rev)" marker-end="url(#arrowhead)"/>
    <line x1="0" y1="-30" x2="0" y2="-5" stroke="#666" stroke-width="0.5"/>
    <line x1="120" y1="-30" x2="120" y2="-5" stroke="#666" stroke-width="0.5"/>
    <text x="60" y="-30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">120</text>

    <!-- Chassis length dimension -->
    <line x1="-25" y1="0" x2="-25" y2="200" stroke="#666" stroke-width="0.5"
          marker-start="url(#arrowhead-rev)" marker-end="url(#arrowhead)"/>
    <line x1="-30" y1="0" x2="-5" y2="0" stroke="#666" stroke-width="0.5"/>
    <line x1="-30" y1="200" x2="-5" y2="200" stroke="#666" stroke-width="0.5"/>
    <text x="-35" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666" transform="rotate(-90, -35, 100)">200</text>

    <!-- Front axle mounting holes -->
    <circle cx="15" cy="25" r="2" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="105" cy="25" r="2" fill="none" stroke="#000" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">M3 holes</text>

    <!-- Servo mount cutout -->
    <rect x="35" y="35" width="50" height="25" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="60" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">Servo</text>

    <!-- Servo mount dimension -->
    <line x1="35" y1="70" x2="85" y2="70" stroke="#666" stroke-width="0.5"
          marker-start="url(#arrowhead-rev)" marker-end="url(#arrowhead)"/>
    <text x="60" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">50</text>

    <!-- ESP32 mounting area -->
    <rect x="20" y="80" width="80" height="50" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="60" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">ESP32</text>

    <!-- Motor driver mounting area -->
    <rect x="20" y="140" width="80" height="30" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="60" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Driver</text>

    <!-- Rear axle / motor mounting holes -->
    <circle cx="15" cy="185" r="2" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="105" cy="185" r="2" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="60" cy="185" r="3" fill="none" stroke="#000" stroke-width="1"/>
    <text x="60" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">Motor mount</text>

    <!-- Wheelbase dimension -->
    <line x1="145" y1="25" x2="145" y2="185" stroke="#0066cc" stroke-width="0.5"
          marker-start="url(#arrowhead-rev)" marker-end="url(#arrowhead)"/>
    <line x1="125" y1="25" x2="150" y2="25" stroke="#0066cc" stroke-width="0.5"/>
    <line x1="125" y1="185" x2="150" y2="185" stroke="#0066cc" stroke-width="0.5"/>
    <text x="155" y="105" text-anchor="start" font-family="Arial, sans-serif" font-size="10" fill="#0066cc">WB=160</text>

  </g>

  <!-- ========== FRONT STEERING ASSEMBLY ========== -->
  <g id="steering-assembly" transform="translate(150, 380)">

    <text x="60" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Front Steering Assembly</text>

    <!-- Left steering knuckle -->
    <g id="left-knuckle">
      <rect x="-30" y="0" width="40" height="60" rx="3" ry="3" fill="none" stroke="#000" stroke-width="2"/>
      <!-- Kingpin hole (steering pivot) -->
      <circle cx="-10" cy="15" r="3" fill="none" stroke="#000" stroke-width="1.5"/>
      <text x="-10" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#666">Pivot</text>
      <!-- Wheel axle hole -->
      <circle cx="-10" cy="45" r="4" fill="none" stroke="#000" stroke-width="1.5"/>
      <text x="-10" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#666">Axle ⌀8</text>
      <!-- Steering arm attachment -->
      <circle cx="5" cy="30" r="2" fill="none" stroke="#e74c3c" stroke-width="1"/>
    </g>

    <!-- Right steering knuckle -->
    <g id="right-knuckle">
      <rect x="110" y="0" width="40" height="60" rx="3" ry="3" fill="none" stroke="#000" stroke-width="2"/>
      <!-- Kingpin hole -->
      <circle cx="130" cy="15" r="3" fill="none" stroke="#000" stroke-width="1.5"/>
      <!-- Wheel axle hole -->
      <circle cx="130" cy="45" r="4" fill="none" stroke="#000" stroke-width="1.5"/>
      <!-- Steering arm attachment -->
      <circle cx="115" cy="30" r="2" fill="none" stroke="#e74c3c" stroke-width="1"/>
    </g>

    <!-- Tie rod -->
    <line x1="5" y1="30" x2="115" y2="30" stroke="#e74c3c" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#e74c3c">Tie Rod</text>

    <!-- Tie rod length dimension -->
    <line x1="5" y1="75" x2="115" y2="75" stroke="#666" stroke-width="0.5"
          marker-start="url(#arrowhead-rev)" marker-end="url(#arrowhead)"/>
    <text x="60" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">110</text>

    <!-- Servo horn connection point -->
    <circle cx="60" cy="30" r="2.5" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
    <text x="60" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#e74c3c">Servo link</text>

    <!-- Track width dimension -->
    <line x1="-10" y1="-25" x2="130" y2="-25" stroke="#0066cc" stroke-width="0.5"
          marker-start="url(#arrowhead-rev)" marker-end="url(#arrowhead)"/>
    <line x1="-10" y1="-30" x2="-10" y2="-5" stroke="#0066cc" stroke-width="0.5"/>
    <line x1="130" y1="-30" x2="130" y2="-5" stroke="#0066cc" stroke-width="0.5"/>
    <text x="60" y="-30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0066cc">Track=140</text>

    <!-- Knuckle width dimension -->
    <line x1="-30" y1="95" x2="10" y2="95" stroke="#666" stroke-width="0.5"
          marker-start="url(#arrowhead-rev)" marker-end="url(#arrowhead)"/>
    <text x="-10" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">40</text>

    <!-- Knuckle height dimension -->
    <line x1="-45" y1="0" x2="-45" y2="60" stroke="#666" stroke-width="0.5"
          marker-start="url(#arrowhead-rev)" marker-end="url(#arrowhead)"/>
    <text x="-55" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666" transform="rotate(-90,-55,30)">60</text>

  </g>

  <!-- ========== STEERING ARM DETAIL ========== -->
  <g id="steering-arm-detail" transform="translate(400, 380)">

    <text x="60" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Steering Arm (x2)</text>

    <!-- Steering arm outline -->
    <path d="M 20,20 L 100,20 L 100,35 L 20,35 Z" fill="none" stroke="#000" stroke-width="2"/>

    <!-- Kingpin end (attaches to knuckle) -->
    <circle cx="30" cy="27.5" r="4" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="30" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">⌀8 bore</text>

    <!-- Tie rod end (ball joint) -->
    <circle cx="90" cy="27.5" r="2.5" fill="none" stroke="#e74c3c" stroke-width="1"/>
    <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#e74c3c">M3 ball</text>

    <!-- Arm length dimension -->
    <line x1="30" y1="55" x2="90" y2="55" stroke="#666" stroke-width="0.5"
          marker-start="url(#arrowhead-rev)" marker-end="url(#arrowhead)"/>
    <text x="60" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">60</text>

    <!-- Arm width dimension -->
    <line x1="110" y1="20" x2="110" y2="35" stroke="#666" stroke-width="0.5"
          marker-start="url(#arrowhead-rev)" marker-end="url(#arrowhead)"/>
    <text x="120" y="30" text-anchor="start" font-family="Arial, sans-serif" font-size="8" fill="#666">15</text>

  </g>

  <!-- ========== SERVO HORN / LINKAGE ========== -->
  <g id="servo-linkage" transform="translate(400, 480)">

    <text x="60" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Servo Horn Linkage</text>

    <!-- Servo horn -->
    <circle cx="30" cy="30" r="15" fill="none" stroke="#3498db" stroke-width="2"/>
    <circle cx="30" cy="30" r="3" fill="none" stroke="#3498db" stroke-width="1"/>
    <text x="30" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#3498db">Servo spline</text>

    <!-- Push rod attachment hole -->
    <circle cx="42" cy="30" r="1.5" fill="none" stroke="#e74c3c" stroke-width="1"/>

    <!-- Push rod -->
    <line x1="42" y1="30" x2="100" y2="30" stroke="#e74c3c" stroke-width="1.5"/>

    <!-- Connection to tie rod -->
    <circle cx="100" cy="30" r="2" fill="#e74c3c"/>
    <text x="100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#e74c3c">To tie rod</text>

    <!-- Servo horn radius dimension -->
    <line x1="30" y1="30" x2="45" y2="30" stroke="#666" stroke-width="0.5"
          marker-end="url(#arrowhead)"/>
    <text x="37" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">R15</text>

    <!-- Hole offset dimension -->
    <line x1="30" y1="55" x2="42" y2="55" stroke="#666" stroke-width="0.5"
          marker-start="url(#arrowhead-rev)" marker-end="url(#arrowhead)"/>
    <text x="36" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">12</text>

  </g>

  <!-- ========== PARTS LIST ========== -->
  <g id="parts-list" transform="translate(10, 600)">
    <rect x="0" y="0" width="280" height="180" fill="none" stroke="#333" stroke-width="1"/>
    <text x="140" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">3D Printed Parts List</text>

    <text x="10" y="45" font-family="monospace" font-size="10" fill="#333">1. Main chassis plate     (1x)</text>
    <text x="10" y="60" font-family="monospace" font-size="10" fill="#333">2. Front steering knuckle (2x)</text>
    <text x="10" y="75" font-family="monospace" font-size="10" fill="#333">3. Steering arm           (2x)</text>
    <text x="10" y="90" font-family="monospace" font-size="10" fill="#333">4. Tie rod                (1x)</text>
    <text x="10" y="105" font-family="monospace" font-size="10" fill="#333">5. Servo mount bracket    (1x)</text>
    <text x="10" y="120" font-family="monospace" font-size="10" fill="#333">6. Motor mount bracket    (1x)</text>
    <text x="10" y="135" font-family="monospace" font-size="10" fill="#333">7. Wheel hub              (4x)</text>

    <line x1="0" y1="145" x2="280" y2="145" stroke="#ccc" stroke-width="1"/>
    <text x="10" y="165" font-family="Arial, sans-serif" font-size="9" fill="#666">Hardware: M3 screws, 8mm shaft, bearings</text>
    <text x="10" y="178" font-family="Arial, sans-serif" font-size="9" fill="#666">Material: PLA/PETG, 0.2mm layer, 20% infill</text>
  </g>

  <!-- ========== KEY DIMENSIONS ========== -->
  <g id="key-dimensions" transform="translate(310, 600)">
    <rect x="0" y="0" width="280" height="180" fill="none" stroke="#333" stroke-width="1"/>
    <text x="140" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Key Dimensions (mm)</text>

    <text x="10" y="45" font-family="monospace" font-size="10" fill="#333">Wheelbase:        160</text>
    <text x="10" y="60" font-family="monospace" font-size="10" fill="#333">Track width:      140</text>
    <text x="10" y="75" font-family="monospace" font-size="10" fill="#333">Chassis length:   200</text>
    <text x="10" y="90" font-family="monospace" font-size="10" fill="#333">Chassis width:    120</text>
    <text x="10" y="105" font-family="monospace" font-size="10" fill="#333">Wheel diameter:   ~65 (std RC)</text>
    <text x="10" y="120" font-family="monospace" font-size="10" fill="#333">Steering arm:     60</text>
    <text x="10" y="135" font-family="monospace" font-size="10" fill="#333">Tie rod length:   110</text>

    <line x1="0" y1="145" x2="280" y2="145" stroke="#ccc" stroke-width="1"/>
    <text x="10" y="165" font-family="Arial, sans-serif" font-size="9" fill="#666">Max steering angle: ±30°</text>
    <text x="10" y="178" font-family="Arial, sans-serif" font-size="9" fill="#666">Ackermann ratio: ~80%</text>
  </g>

</svg>
