<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <title>ESP32 Rover - Top View</title>

  <!-- Background -->
  <rect width="400" height="500" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">ESP32 Rover - Top View</text>

  <!-- Scale indicator -->
  <line x1="320" y1="480" x2="380" y2="480" stroke="#666" stroke-width="2"/>
  <line x1="320" y1="475" x2="320" y2="485" stroke="#666" stroke-width="2"/>
  <line x1="380" y1="475" x2="380" y2="485" stroke="#666" stroke-width="2"/>
  <text x="350" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">50mm</text>

  <!-- Main chassis frame -->
  <rect x="100" y="60" width="200" height="380" rx="10" ry="10" fill="none" stroke="#333" stroke-width="3"/>

  <!-- Chassis cross members -->
  <line x1="100" y1="150" x2="300" y2="150" stroke="#333" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="100" y1="300" x2="300" y2="300" stroke="#333" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- ===== FRONT AXLE & STEERING ===== -->

  <!-- Front axle line -->
  <line x1="60" y1="100" x2="340" y2="100" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Front left wheel assembly -->
  <g id="front-left-wheel">
    <!-- Steering knuckle pivot point -->
    <circle cx="80" cy="100" r="4" fill="#e74c3c"/>
    <!-- Wheel -->
    <rect x="45" y="85" width="30" height="50" rx="5" ry="5" fill="#333" stroke="#000" stroke-width="1"/>
    <text x="60" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">FL</text>
    <!-- Steering arm (pointing inward toward center) -->
    <line x1="80" y1="100" x2="80" y2="130" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="80" cy="130" r="3" fill="#e74c3c"/>
  </g>

  <!-- Front right wheel assembly -->
  <g id="front-right-wheel">
    <!-- Steering knuckle pivot point -->
    <circle cx="320" cy="100" r="4" fill="#e74c3c"/>
    <!-- Wheel -->
    <rect x="325" y="85" width="30" height="50" rx="5" ry="5" fill="#333" stroke="#000" stroke-width="1"/>
    <text x="340" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">FR</text>
    <!-- Steering arm (pointing inward toward center) -->
    <line x1="320" y1="100" x2="320" y2="130" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="320" cy="130" r="3" fill="#e74c3c"/>
  </g>

  <!-- Tie rod (connects both steering arms) -->
  <line x1="80" y1="130" x2="320" y2="130" stroke="#e74c3c" stroke-width="2"/>

  <!-- Steering servo and linkage -->
  <g id="steering-servo">
    <!-- Servo body -->
    <rect x="175" y="140" width="50" height="30" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="200" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">SERVO</text>
    <!-- Servo horn pivot -->
    <circle cx="200" cy="140" r="5" fill="#2980b9"/>
    <!-- Servo arm -->
    <line x1="200" y1="140" x2="200" y2="130" stroke="#2980b9" stroke-width="3"/>
    <!-- Connection to tie rod -->
    <circle cx="200" cy="130" r="3" fill="#e74c3c"/>
  </g>

  <!-- ===== REAR AXLE & DRIVE ===== -->

  <!-- Rear axle line -->
  <line x1="60" y1="380" x2="340" y2="380" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Rear left wheel (driven) -->
  <g id="rear-left-wheel">
    <rect x="45" y="355" width="30" height="50" rx="5" ry="5" fill="#333" stroke="#000" stroke-width="1"/>
    <text x="60" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">RL</text>
    <!-- Axle connection -->
    <circle cx="75" cy="380" r="4" fill="#27ae60"/>
  </g>

  <!-- Rear right wheel (driven) -->
  <g id="rear-right-wheel">
    <rect x="325" y="355" width="30" height="50" rx="5" ry="5" fill="#333" stroke="#000" stroke-width="1"/>
    <text x="340" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">RR</text>
    <!-- Axle connection -->
    <circle cx="325" cy="380" r="4" fill="#27ae60"/>
  </g>

  <!-- Rear axle / drive shaft -->
  <line x1="75" y1="380" x2="325" y2="380" stroke="#27ae60" stroke-width="3"/>

  <!-- ===== BLDC MOTOR ===== -->
  <g id="bldc-motor">
    <!-- Motor body -->
    <circle cx="200" cy="380" r="25" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
    <circle cx="200" cy="380" r="8" fill="#1e8449"/>
    <text x="200" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">BLDC</text>
    <!-- Motor mount -->
    <rect x="175" y="350" width="50" height="10" fill="#666"/>
  </g>

  <!-- ===== ELECTRONICS ===== -->

  <!-- ESP32-CAM / TTGO module -->
  <g id="esp32">
    <rect x="150" y="200" width="100" height="60" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
    <text x="200" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">ESP32</text>
    <text x="200" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">CAM/TTGO</text>
    <!-- Camera lens (for ESP32-CAM) -->
    <circle cx="200" cy="195" r="8" fill="#2c3e50" stroke="#1a252f" stroke-width="1"/>
  </g>

  <!-- Motor driver (SimpleFOC Mini) -->
  <g id="motor-driver">
    <rect x="150" y="280" width="100" height="40" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
    <text x="200" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">SimpleFOC</text>
    <text x="200" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">Mini</text>
  </g>

  <!-- AS5600 Encoder (on motor) -->
  <g id="encoder">
    <rect x="185" y="410" width="30" height="20" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
    <text x="200" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#fff">AS5600</text>
  </g>

  <!-- Battery -->
  <g id="battery">
    <rect x="260" y="200" width="30" height="80" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="275" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff" transform="rotate(90, 275, 235)">2S LiPo</text>
  </g>

  <!-- BEC (5V regulator) -->
  <g id="bec">
    <rect x="110" y="220" width="30" height="20" fill="#1abc9c" stroke="#16a085" stroke-width="1"/>
    <text x="125" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#fff">BEC</text>
  </g>

  <!-- ===== DIMENSIONS ===== -->

  <!-- Wheelbase dimension -->
  <g id="dim-wheelbase">
    <line x1="30" y1="100" x2="30" y2="380" stroke="#999" stroke-width="1"/>
    <line x1="25" y1="100" x2="35" y2="100" stroke="#999" stroke-width="1"/>
    <line x1="25" y1="380" x2="35" y2="380" stroke="#999" stroke-width="1"/>
    <text x="20" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666" transform="rotate(-90, 20, 245)">Wheelbase</text>
  </g>

  <!-- Track width dimension -->
  <g id="dim-track">
    <line x1="60" y1="50" x2="340" y2="50" stroke="#999" stroke-width="1"/>
    <line x1="60" y1="45" x2="60" y2="55" stroke="#999" stroke-width="1"/>
    <line x1="340" y1="45" x2="340" y2="55" stroke="#999" stroke-width="1"/>
    <text x="200" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Track Width</text>
  </g>

  <!-- ===== LEGEND ===== -->
  <g id="legend" transform="translate(10, 440)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">Legend:</text>

    <rect x="0" y="8" width="12" height="8" fill="#e74c3c"/>
    <text x="16" y="16" font-family="Arial, sans-serif" font-size="8" fill="#333">Steering linkage</text>

    <rect x="90" y="8" width="12" height="8" fill="#27ae60"/>
    <text x="106" y="16" font-family="Arial, sans-serif" font-size="8" fill="#333">Drive system</text>

    <rect x="180" y="8" width="12" height="8" fill="#9b59b6"/>
    <text x="196" y="16" font-family="Arial, sans-serif" font-size="8" fill="#333">Controller</text>

    <rect x="260" y="8" width="12" height="8" fill="#e67e22"/>
    <text x="276" y="16" font-family="Arial, sans-serif" font-size="8" fill="#333">Motor driver</text>
  </g>

  <!-- Direction arrow -->
  <g id="direction">
    <polygon points="200,70 210,85 205,85 205,95 195,95 195,85 190,85" fill="#333"/>
    <text x="200" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">FRONT</text>
  </g>

</svg>
