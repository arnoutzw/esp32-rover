<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <style>
      .title { font: bold 14px sans-serif; fill: #333; }
      .label { font: 10px sans-serif; fill: #333; }
      .dim { font: 8px sans-serif; fill: #666; }
      .component { stroke: #333; stroke-width: 1; }
      .chassis { fill: #e8e8e8; }
      .electronics { fill: #a8d4a8; }
      .motor { fill: #d4a8a8; }
      .mechanical { fill: #a8c4d4; }
      .hole { fill: white; stroke: #333; stroke-width: 0.5; }
      .cutout { fill: #f8f8f8; stroke: #666; stroke-width: 0.5; stroke-dasharray: 2,1; }
      .center-line { stroke: #999; stroke-width: 0.3; stroke-dasharray: 4,2; }
    </style>
  </defs>

  <!-- Title -->
  <text x="200" y="20" text-anchor="middle" class="title">ESP32 Rover Component Footprints</text>
  <text x="200" y="35" text-anchor="middle" class="dim">Scale: 2:1 (dimensions in mm)</text>

  <!-- Lower Chassis - 160x80mm -->
  <g transform="translate(40, 60)">
    <text x="80" y="-5" text-anchor="middle" class="label">Lower Chassis (160×80×3mm)</text>
    <rect x="0" y="0" width="160" height="80" rx="2" class="component chassis"/>

    <!-- Battery Cutout 67x40mm centered -->
    <rect x="46.5" y="20" width="67" height="40" rx="1" class="cutout"/>
    <text x="80" y="43" text-anchor="middle" class="dim">Battery 67×40</text>

    <!-- Motor mount area -->
    <circle cx="140" cy="40" r="4" class="hole"/>
    <circle cx="132" cy="40" r="1.6" class="hole"/>
    <circle cx="148" cy="40" r="1.6" class="hole"/>
    <circle cx="140" cy="32" r="1.6" class="hole"/>
    <circle cx="140" cy="48" r="1.6" class="hole"/>
    <text x="140" y="60" text-anchor="middle" class="dim">Motor</text>

    <!-- Mounting holes M3 -->
    <circle cx="8" cy="8" r="1.6" class="hole"/>
    <circle cx="152" cy="8" r="1.6" class="hole"/>
    <circle cx="8" cy="72" r="1.6" class="hole"/>
    <circle cx="152" cy="72" r="1.6" class="hole"/>
    <circle cx="80" cy="8" r="1.6" class="hole"/>
    <circle cx="80" cy="72" r="1.6" class="hole"/>

    <!-- Dimensions -->
    <line x1="0" y1="-3" x2="160" y2="-3" stroke="#666" stroke-width="0.5"/>
    <text x="80" y="-6" text-anchor="middle" class="dim">160</text>
    <line x1="163" y1="0" x2="163" y2="80" stroke="#666" stroke-width="0.5"/>
    <text x="170" y="43" text-anchor="middle" class="dim" transform="rotate(90, 170, 43)">80</text>
  </g>

  <!-- Upper Chassis - 140x70mm -->
  <g transform="translate(50, 175)">
    <text x="70" y="-5" text-anchor="middle" class="label">Upper Chassis (140×70×3mm)</text>
    <rect x="0" y="0" width="140" height="70" rx="2" class="component chassis"/>

    <!-- ESP32-CAM cutout 28x42mm -->
    <rect x="5" y="14" width="28" height="42" rx="1" class="cutout"/>
    <text x="19" y="38" text-anchor="middle" class="dim">CAM</text>

    <!-- SimpleFOC mount 25x25mm -->
    <rect x="57.5" y="22.5" width="25" height="25" rx="1" class="cutout"/>
    <text x="70" y="38" text-anchor="middle" class="dim">FOC</text>

    <!-- Servo mount 23x12mm -->
    <rect x="100" y="29" width="23" height="12" rx="1" class="cutout"/>
    <text x="111.5" y="38" text-anchor="middle" class="dim">Servo</text>

    <!-- Mounting holes -->
    <circle cx="8" cy="8" r="1.6" class="hole"/>
    <circle cx="132" cy="8" r="1.6" class="hole"/>
    <circle cx="8" cy="62" r="1.6" class="hole"/>
    <circle cx="132" cy="62" r="1.6" class="hole"/>
    <circle cx="70" cy="8" r="1.6" class="hole"/>
    <circle cx="70" cy="62" r="1.6" class="hole"/>

    <!-- Dimensions -->
    <line x1="0" y1="-3" x2="140" y2="-3" stroke="#666" stroke-width="0.5"/>
    <text x="70" y="-6" text-anchor="middle" class="dim">140</text>
  </g>

  <!-- Individual Components Row 1 -->
  <g transform="translate(20, 280)">
    <!-- ESP32-CAM - 27x40.5mm -->
    <text x="27" y="-5" text-anchor="middle" class="label">ESP32-CAM</text>
    <rect x="0" y="0" width="27" height="40.5" rx="1" class="component electronics"/>
    <rect x="8" y="2" width="11" height="11" class="cutout"/>
    <text x="13.5" y="10" text-anchor="middle" class="dim">Lens</text>
    <text x="13.5" y="25" text-anchor="middle" class="dim">27×40.5</text>
  </g>

  <g transform="translate(70, 280)">
    <!-- SimpleFOC Mini - 25x25mm -->
    <text x="12.5" y="-5" text-anchor="middle" class="label">SimpleFOC Mini</text>
    <rect x="0" y="0" width="25" height="25" rx="1" class="component electronics"/>
    <text x="12.5" y="15" text-anchor="middle" class="dim">25×25</text>
    <circle cx="3" cy="3" r="1.5" class="hole"/>
    <circle cx="22" cy="3" r="1.5" class="hole"/>
    <circle cx="3" cy="22" r="1.5" class="hole"/>
    <circle cx="22" cy="22" r="1.5" class="hole"/>
  </g>

  <g transform="translate(120, 280)">
    <!-- MG90S Servo - 32x12mm (with tabs) -->
    <text x="16" y="-5" text-anchor="middle" class="label">MG90S Servo</text>
    <rect x="4.75" y="0" width="22.5" height="22" rx="1" class="component electronics"/>
    <rect x="0" y="5" width="32" height="2.5" class="component electronics"/>
    <circle cx="2" cy="6.25" r="1" class="hole"/>
    <circle cx="30" cy="6.25" r="1" class="hole"/>
    <text x="16" y="15" text-anchor="middle" class="dim">32×12×22</text>
    <!-- Output shaft -->
    <circle cx="16" cy="-3" r="2.9" fill="#666"/>
    <text x="16" y="-8" text-anchor="middle" class="dim">Spline</text>
  </g>

  <g transform="translate(175, 280)">
    <!-- A2212 Motor - 27.5mm dia -->
    <text x="13.75" y="-5" text-anchor="middle" class="label">A2212 Motor</text>
    <circle cx="13.75" cy="13.75" r="13.75" class="component motor"/>
    <circle cx="13.75" cy="13.75" r="1.585" fill="#666"/>
    <!-- Mounting holes 16mm pattern -->
    <circle cx="5.75" cy="13.75" r="1.5" class="hole"/>
    <circle cx="21.75" cy="13.75" r="1.5" class="hole"/>
    <circle cx="13.75" cy="5.75" r="1.5" class="hole"/>
    <circle cx="13.75" cy="21.75" r="1.5" class="hole"/>
    <text x="13.75" y="35" text-anchor="middle" class="dim">Ø27.5</text>
  </g>

  <!-- Individual Components Row 2 -->
  <g transform="translate(20, 365)">
    <!-- AS5600 Encoder - typical 15x15mm breakout -->
    <text x="7.5" y="-5" text-anchor="middle" class="label">AS5600</text>
    <rect x="0" y="0" width="15" height="15" rx="1" class="component electronics"/>
    <circle cx="7.5" cy="7.5" r="4" fill="#666"/>
    <text x="7.5" y="9" text-anchor="middle" class="dim" fill="white">IC</text>
    <text x="7.5" y="23" text-anchor="middle" class="dim">15×15</text>
  </g>

  <g transform="translate(60, 365)">
    <!-- 18650 Battery - 18.4x65mm -->
    <text x="32.5" y="-5" text-anchor="middle" class="label">18650 Cell (×2)</text>
    <rect x="0" y="0" width="65" height="18.4" rx="9.2" class="component motor"/>
    <circle cx="62" cy="9.2" r="3" fill="#666"/>
    <text x="32.5" y="12" text-anchor="middle" class="dim">65×Ø18.4</text>
  </g>

  <g transform="translate(145, 365)">
    <!-- Wheel Hub - 25mm dia, 15mm length -->
    <text x="12.5" y="-5" text-anchor="middle" class="label">Wheel Hub</text>
    <circle cx="12.5" cy="12.5" r="12.5" class="component mechanical"/>
    <circle cx="12.5" cy="12.5" r="2.6" class="hole"/>
    <text x="12.5" y="14" text-anchor="middle" class="dim">Ø25</text>
    <!-- Hex pattern indicator -->
    <polygon points="12.5,4 18.9,8.25 18.9,16.75 12.5,21 6.1,16.75 6.1,8.25" fill="none" stroke="#666" stroke-width="0.5"/>
  </g>

  <!-- Individual Components Row 3 -->
  <g transform="translate(20, 430)">
    <!-- Motor Mount - 40x40mm -->
    <text x="20" y="-5" text-anchor="middle" class="label">Motor Mount</text>
    <rect x="0" y="0" width="40" height="40" rx="2" class="component mechanical"/>
    <circle cx="20" cy="20" r="14" class="cutout"/>
    <!-- Slots for adjustment -->
    <rect x="5" y="5" width="8" height="3" rx="1" class="hole"/>
    <rect x="27" y="5" width="8" height="3" rx="1" class="hole"/>
    <rect x="5" y="32" width="8" height="3" rx="1" class="hole"/>
    <rect x="27" y="32" width="8" height="3" rx="1" class="hole"/>
    <text x="20" y="48" text-anchor="middle" class="dim">40×40</text>
  </g>

  <g transform="translate(80, 430)">
    <!-- Steering Knuckle - 20x35mm approx -->
    <text x="10" y="-5" text-anchor="middle" class="label">Steering Knuckle</text>
    <rect x="0" y="0" width="20" height="25" rx="2" class="component mechanical"/>
    <rect x="5" y="25" width="15" height="10" rx="1" class="component mechanical"/>
    <circle cx="10" cy="7" r="2.5" class="hole"/>
    <circle cx="10" cy="30" r="0.75" class="hole"/>
    <text x="10" y="43" text-anchor="middle" class="dim">20×35</text>
  </g>

  <g transform="translate(130, 430)">
    <!-- Camera Bracket - 50x35mm base -->
    <text x="25" y="-5" text-anchor="middle" class="label">Camera Bracket</text>
    <rect x="0" y="0" width="50" height="35" rx="2" class="component mechanical"/>
    <!-- Angled back representation -->
    <polygon points="0,10 50,10 50,0 45,0 5,0 0,0" fill="#8ab4c4" stroke="#333" stroke-width="1"/>
    <circle cx="10" cy="7.5" r="1.6" class="hole"/>
    <circle cx="10" cy="27.5" r="1.6" class="hole"/>
    <circle cx="40" cy="7.5" r="1.6" class="hole"/>
    <circle cx="40" cy="27.5" r="1.6" class="hole"/>
    <text x="25" y="23" text-anchor="middle" class="dim">50×35</text>
  </g>

  <g transform="translate(200, 430)">
    <!-- Differential Housing - 50x25mm -->
    <text x="25" y="-5" text-anchor="middle" class="label">Differential</text>
    <ellipse cx="25" cy="12.5" rx="25" ry="12.5" class="component mechanical"/>
    <line x1="0" y1="12.5" x2="50" y2="12.5" class="center-line"/>
    <circle cx="5" cy="12.5" r="2.6" class="hole"/>
    <circle cx="45" cy="12.5" r="2.6" class="hole"/>
    <text x="25" y="33" text-anchor="middle" class="dim">50×25</text>
  </g>

  <!-- Legend -->
  <g transform="translate(20, 520)">
    <text x="0" y="0" class="label" font-weight="bold">Legend:</text>
    <rect x="0" y="10" width="15" height="10" class="chassis"/>
    <text x="20" y="18" class="dim">Chassis Plates</text>
    <rect x="80" y="10" width="15" height="10" class="electronics"/>
    <text x="100" y="18" class="dim">Electronics</text>
    <rect x="160" y="10" width="15" height="10" class="motor"/>
    <text x="180" y="18" class="dim">Motor/Battery</text>
    <rect x="250" y="10" width="15" height="10" class="mechanical"/>
    <text x="270" y="18" class="dim">3D Printed Parts</text>
    <circle cx="7.5" cy="40" r="3" class="hole"/>
    <text x="20" y="43" class="dim">Mounting Holes</text>
    <rect x="80" y="35" width="15" height="10" class="cutout"/>
    <text x="100" y="43" class="dim">Cutouts</text>
  </g>

  <!-- Assembly Overview -->
  <g transform="translate(240, 60)">
    <text x="70" y="-5" text-anchor="middle" class="label">Assembly Top View</text>
    <rect x="0" y="0" width="140" height="120" rx="2" fill="none" stroke="#333" stroke-width="0.5" stroke-dasharray="3,2"/>

    <!-- Wheels -->
    <ellipse cx="-5" cy="20" rx="8" ry="15" fill="#444"/>
    <ellipse cx="145" cy="20" rx="8" ry="15" fill="#444"/>
    <ellipse cx="-5" cy="100" rx="8" ry="15" fill="#444"/>
    <ellipse cx="145" cy="100" rx="8" ry="15" fill="#444"/>

    <!-- Camera (front) -->
    <rect x="10" y="5" width="20" height="25" rx="1" class="electronics"/>
    <circle cx="20" cy="15" r="5" fill="#666"/>
    <text x="20" y="40" text-anchor="middle" class="dim">CAM</text>

    <!-- SimpleFOC -->
    <rect x="57.5" y="35" width="25" height="25" rx="1" class="electronics"/>
    <text x="70" y="51" text-anchor="middle" class="dim">FOC</text>

    <!-- Servo -->
    <rect x="50" y="70" width="25" height="15" rx="1" class="electronics"/>
    <text x="62.5" y="81" text-anchor="middle" class="dim">Servo</text>

    <!-- Battery -->
    <rect x="35" y="90" width="70" height="25" rx="3" class="motor"/>
    <text x="70" y="106" text-anchor="middle" class="dim">Battery</text>

    <!-- Motor + Diff -->
    <circle cx="110" cy="95" r="12" class="motor"/>
    <text x="110" y="98" text-anchor="middle" class="dim">M</text>

    <!-- Steering linkage -->
    <line x1="62.5" y1="77" x2="20" y2="40" stroke="#666" stroke-width="0.5"/>
    <line x1="62.5" y1="77" x2="120" y2="40" stroke="#666" stroke-width="0.5"/>
  </g>

  <!-- Notes -->
  <text x="200" y="585" text-anchor="middle" class="dim">All dimensions in millimeters. CAD files: docs/mechanical/cad/</text>
</svg>
