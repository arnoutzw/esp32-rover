# =============================================================================
# ESP32 WiFi Rover Configuration
# =============================================================================
# This YAML file configures compile-time options for the rover firmware.
# Run `python generate_config.py` to regenerate config_generated.h
# =============================================================================

# -----------------------------------------------------------------------------
# Build Target
# -----------------------------------------------------------------------------
target: ttgo  # Options: "esp32cam" or "ttgo"

# -----------------------------------------------------------------------------
# WiFi Configuration
# -----------------------------------------------------------------------------
wifi:
  # WiFi mode: "ap_only", "sta_only", or "sta_first"
  # - ap_only: Always start as Access Point
  # - sta_only: Only connect to network (no fallback)
  # - sta_first: Try to connect to network first, fall back to AP if not found
  mode: sta_first

  # Access Point settings (used when mode is ap_only or as fallback)
  ap:
    ssid: "ESP32-Rover"
    password: "rover1234"
    channel: 1
    max_connections: 4

  # Station settings (used when mode is sta_only or sta_first)
  sta:
    ssid: "KPNCCD9C6"
    password: "Xtvd6fh3FncT2cd8"
    # Timeout in seconds before falling back to AP mode (sta_first mode only)
    connect_timeout: 10

# -----------------------------------------------------------------------------
# REST API Configuration
# -----------------------------------------------------------------------------
rest_api:
  # Enable the diagnostic REST API endpoint (/api/diagnostics)
  enabled: true
  # Update rate for cached data in milliseconds
  cache_interval_ms: 1000

# -----------------------------------------------------------------------------
# MQTT Configuration
# -----------------------------------------------------------------------------
mqtt:
  # Enable MQTT diagnostic publishing
  enabled: true
  # MQTT broker settings
  broker:
    host: "192.168.1.100"
    port: 1883
    # Leave empty for anonymous connection
    username: ""
    password: ""
  # Client settings
  client_id: "esp32-rover"
  # Topic prefix for diagnostic messages
  topic_prefix: "esp32-rover"
  # Publish interval in milliseconds
  publish_interval_ms: 5000
  # QoS level (0, 1, or 2)
  qos: 0

# -----------------------------------------------------------------------------
# Motor Configuration
# -----------------------------------------------------------------------------
motor:
  pole_pairs: 7
  voltage_limit: 6.0
  velocity_limit: 20.0
  pwm_frequency: 20000
  pid:
    p: 0.2
    i: 2.0
    d: 0.0
    ramp: 1000.0
  lpf_time_constant: 0.01

# -----------------------------------------------------------------------------
# Servo Configuration
# -----------------------------------------------------------------------------
servo:
  min_pulse_us: 500
  max_pulse_us: 2500
  center_pulse_us: 1500
  max_angle: 45
  trim: 0

# -----------------------------------------------------------------------------
# Control Parameters
# -----------------------------------------------------------------------------
control:
  loop_frequency_hz: 100
  watchdog_timeout_ms: 500
  max_speed_percent: 100
  speed_ramp_rate: 5

# -----------------------------------------------------------------------------
# Safety Features
# -----------------------------------------------------------------------------
safety:
  watchdog_enabled: true
  estop_enabled: true

# -----------------------------------------------------------------------------
# Debug Options
# -----------------------------------------------------------------------------
debug:
  motor: false
  encoder: false
  servo: false
  camera: false
  webserver: false
  mqtt: false
