# =============================================================================
# ESP32 WiFi Rover Configuration
# =============================================================================
# This YAML file configures compile-time options for the rover firmware.
# Run `python generate_config.py` to regenerate config_generated.h
#
# NOTE: Sensitive credentials (passwords, SSIDs) are stored in secrets.yaml
#       Copy secrets.yaml.example to secrets.yaml and fill in your values.
# =============================================================================

# -----------------------------------------------------------------------------
# Build Target (for config generation - mDNS hostname selection)
# -----------------------------------------------------------------------------
# NOTE: This sets target-specific options like mDNS hostname.
# The actual build target is selected via: ./build.sh esp32cam or ./build.sh ttgo
target: esp32cam  # Options: "esp32cam" or "ttgo"

# -----------------------------------------------------------------------------
# WiFi Configuration
# -----------------------------------------------------------------------------
wifi:
  # WiFi mode: "ap_only", "sta_only", or "sta_first"
  # - ap_only: Always start as Access Point
  # - sta_only: Only connect to network (no fallback)
  # - sta_first: Try to connect to network first, fall back to AP if not found
  mode: sta_first

  # Access Point settings (used when mode is ap_only or as fallback)
  # Password is loaded from secrets.yaml
  ap:
    ssid: "ESP32-Rover"
    channel: 1
    max_connections: 4

  # Station settings (used when mode is sta_only or sta_first)
  # SSID and password are loaded from secrets.yaml
  sta:
    # Timeout in seconds before falling back to AP mode (sta_first mode only)
    connect_timeout: 30

# -----------------------------------------------------------------------------
# REST API Configuration
# -----------------------------------------------------------------------------
rest_api:
  # Enable the diagnostic REST API endpoint (/api/diagnostics)
  enabled: true
  # Update rate for cached data in milliseconds
  cache_interval_ms: 1000

# -----------------------------------------------------------------------------
# MQTT Configuration
# -----------------------------------------------------------------------------
mqtt:
  # Enable MQTT diagnostic publishing
  enabled: true
  # MQTT broker settings
  # Username and password are loaded from secrets.yaml
  broker:
    host: "192.168.1.100"
    port: 1883
  # Client settings
  client_id: "esp32-rover"
  # Topic prefix for diagnostic messages
  topic_prefix: "esp32-rover"
  # Publish interval in milliseconds
  publish_interval_ms: 5000
  # QoS level (0, 1, or 2)
  qos: 0

# -----------------------------------------------------------------------------
# Control Parameters
# -----------------------------------------------------------------------------
control:
  watchdog_timeout_ms: 500
  max_speed_percent: 100
  speed_ramp_rate: 5

# -----------------------------------------------------------------------------
# Safety Features
# -----------------------------------------------------------------------------
safety:
  watchdog_enabled: true
  estop_enabled: true

# -----------------------------------------------------------------------------
# mDNS Configuration (REQ-32)
# -----------------------------------------------------------------------------
# Hostname for mDNS discovery - device will be accessible at <hostname>.local
# Different hostnames per target to allow multiple devices on the same network
mdns:
  # Hostname when building for ESP32-CAM
  hostname_esp32cam: "esp32-rover"
  # Hostname when building for TTGO T-Display
  hostname_ttgo: "ttgo-rover"
  # Instance name shown in service browsers
  instance_name: "ESP32 Rover Control"

# -----------------------------------------------------------------------------
# OTA Update Configuration
# -----------------------------------------------------------------------------
# Password is loaded from secrets.yaml
ota:
  enabled: true

# -----------------------------------------------------------------------------
# Power Management (REQ-30)
# -----------------------------------------------------------------------------
power:
  # Enable deep sleep mode (TTGO only - requires buttons)
  deep_sleep_enabled: true
  # Hold time in milliseconds to activate sleep mode
  sleep_button_hold_time_ms: 5000

# -----------------------------------------------------------------------------
# Task Watchdog Timer (REQ-37)
# -----------------------------------------------------------------------------
# Monitors critical tasks and triggers reboot if any task becomes unresponsive
task_watchdog:
  # Enable task watchdog monitoring
  enabled: true
  # Timeout in seconds before watchdog triggers
  timeout_sec: 30
  # true = reboot on timeout, false = log warning only
  panic_on_timeout: true

# -----------------------------------------------------------------------------
# Debug Options
# -----------------------------------------------------------------------------
debug:
  camera: false
  webserver: false
  mqtt: false
